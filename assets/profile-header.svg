<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bem-Vindo ao Meu Perfil</title>
  <desc id="desc">Cabeçalho escuro com degradê diagonal em tons azulados para o perfil de Victor Alexandro.</desc>
  <defs>
    <linearGradient id="background" x1="1200" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111820"/>
      <stop offset="0.55" stop-color="#202A35"/>
      <stop offset="1" stop-color="#080B10"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="1120" y1="25" x2="120" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1C9AA"/>
      <stop offset="0.42" stop-color="#AFC8E3"/>
      <stop offset="1" stop-color="#6E91B6"/>
    </linearGradient>
    <linearGradient id="lineGradient" x1="1050" y1="0" x2="90" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AFC8E3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#AFC8E3" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F1C9AA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.68" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="titleClip">
      <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1">Bem-Vindo ao Meu Perfil</text>
    </clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shineBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#background)"/>
  <path d="M-40 230L310 -40" stroke="url(#lineGradient)" stroke-width="2"/>
  <path d="M230 300L610 -40" stroke="url(#lineGradient)" stroke-width="1" opacity=".45"/>
  <circle cx="1035" cy="72" r="112" fill="#8CB9E6" fill-opacity=".06"/>
  <circle cx="1035" cy="72" r="72" stroke="#AFC8E3" stroke-opacity=".16"/>
  <text x="600" y="132" text-anchor="middle" fill="url(#titleGradient)" filter="url(#glow)" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="1">Bem-Vindo ao Meu Perfil</text>
  <g>
    <rect x="-260" y="-120" width="700" height="500" transform="rotate(24 0 0)" fill="url(#shineGradient)" filter="url(#shineBlur)">
      <animate attributeName="x" from="-420" to="1240" dur="3.8s" repeatCount="indefinite" />
    </rect>
  </g>
  <text x="600" y="176" text-anchor="middle" fill="#C6D0DB" fill-opacity=".85" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="4">VICTOR ALEXANDRO - DESENVOLVIMENTO</text>
</svg>
